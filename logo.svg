<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6E6FA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD9EC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8F4DE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="petalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD6BA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC9D9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" opacity="0.3"/>
  
  <!-- Flower petals (representing voice waves and neurodiversity) -->
  <g transform="translate(100, 100)">
    <!-- Petal 1 -->
    <ellipse cx="0" cy="-50" rx="20" ry="40" fill="url(#petalGradient)" opacity="0.8" transform="rotate(0)"/>
    <!-- Petal 2 -->
    <ellipse cx="0" cy="-50" rx="20" ry="40" fill="url(#petalGradient)" opacity="0.8" transform="rotate(45)"/>
    <!-- Petal 3 -->
    <ellipse cx="0" cy="-50" rx="20" ry="40" fill="url(#petalGradient)" opacity="0.8" transform="rotate(90)"/>
    <!-- Petal 4 -->
    <ellipse cx="0" cy="-50" rx="20" ry="40" fill="url(#petalGradient)" opacity="0.8" transform="rotate(135)"/>
    <!-- Petal 5 -->
    <ellipse cx="0" cy="-50" rx="20" ry="40" fill="url(#petalGradient)" opacity="0.8" transform="rotate(180)"/>
    <!-- Petal 6 -->
    <ellipse cx="0" cy="-50" rx="20" ry="40" fill="url(#petalGradient)" opacity="0.8" transform="rotate(225)"/>
    <!-- Petal 7 -->
    <ellipse cx="0" cy="-50" rx="20" ry="40" fill="url(#petalGradient)" opacity="0.8" transform="rotate(270)"/>
    <!-- Petal 8 -->
    <ellipse cx="0" cy="-50" rx="20" ry="40" fill="url(#petalGradient)" opacity="0.8" transform="rotate(315)"/>
  </g>
  
  <!-- Center circle (representing the core) -->
  <circle cx="100" cy="100" r="30" fill="#B8A4D9"/>
  
  <!-- Sound waves (representing voice technology) -->
  <path d="M 70 100 Q 65 90, 60 100 T 50 100" stroke="#9B84C8" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 130 100 Q 135 90, 140 100 T 150 100" stroke="#9B84C8" stroke-width="3" fill="none" opacity="0.6"/>
  
  <!-- Inner detail - representing neural network -->
  <circle cx="100" cy="100" r="15" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  <circle cx="100" cy="100" r="8" fill="#FFFFFF" opacity="0.7"/>
</svg>
